<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crux | Text Summarizer</title>
    <style>
        :root {
            --primary: #F97316;
            --primary-hover: #EA580C;
            --primary-light: #FFEDD5;
            --bg-warm: #FFF7ED;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --error-bg: #FEF2F2;
            --error-border: #FCA5A5;
            --error-text: #DC2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-warm);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(249, 115, 22, 0.15);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            color: var(--primary);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            margin: 6px 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .counter {
            font-size: 12px;
            font-weight: normal;
            color: var(--text-muted);
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.5;
            font-family: inherit;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: flex-end;
            margin-top: 5px;
        }

        .shortcut-hint {
            margin-right: auto;
            font-size: 12px;
            color: var(--text-muted);
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
        }

        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #F3F4F6;
            color: var(--text-dark);
        }

        /* Result and Alert Boxes */
        #summary-card {
            display: none;
            margin-top: 25px;
            background: var(--primary-light);
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 8px;
            padding: 18px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .summary-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .summary-header h3 {
            margin: 0;
            font-size: 15px;
            color: var(--primary-hover);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-copy {
            background: #ffffff;
            color: var(--text-dark);
            border: 1px solid rgba(249, 115, 22, 0.3);
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 4px;
        }

        .btn-copy:hover {
            background: #FFF7ED;
            color: var(--primary);
        }

        #summary-text {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
            color: #431407;
            white-space: pre-wrap;
        }

        #error-banner {
            display: none;
            margin-top: 20px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            animation: fadeIn 0.3s ease-in-out;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Crux</h1>
            <p class="subtitle">AI Text & Dialogue Summarization with T5</p>
        </header>

        <form id="summarization-form" class="form-group">
            <label for="dialogue-input">
                <span>Input Text / Dialogue</span>
                <span class="counter" id="text-counter">0 chars</span>
            </label>
            <textarea id="dialogue-input" placeholder="Type or paste your text here (minimum 10 characters)..." required autofocus></textarea>

            <div class="actions">
                <span class="shortcut-hint">Press <b>Ctrl/⌘ + Enter</b> to summarize</span>
                <button type="button" id="clear-btn" class="btn-secondary">Clear</button>
                <button type="submit" id="submit-btn" class="btn-primary">
                    <span id="btn-text">Summarize</span>
                </button>
            </div>
        </form>

        <div id="error-banner" role="alert"></div>

        <div id="summary-card">
            <div class="summary-header">
                <h3>Summary</h3>
                <button type="button" id="copy-btn" class="btn-copy">Copy</button>
            </div>
            <p id="summary-text"></p>
        </div>
    </div>

    <script>
        const form = document.getElementById("summarization-form");
        const dialogueInput = document.getElementById("dialogue-input");
        const counter = document.getElementById("text-counter");
        const submitBtn = document.getElementById("submit-btn");
        const btnText = document.getElementById("btn-text");
        const clearBtn = document.getElementById("clear-btn");
        const summaryCard = document.getElementById("summary-card");
        const summaryText = document.getElementById("summary-text");
        const errorBanner = document.getElementById("error-banner");
        const copyBtn = document.getElementById("copy-btn");

        // Live character / word counter
        function updateCounter() {
            const val = dialogueInput.value;
            const chars = val.length;
            const words = val.trim() ? val.trim().split(/\s+/).length : 0;
            counter.innerText = `${words} words | ${chars} chars`;
        }

        dialogueInput.addEventListener("input", updateCounter);
        updateCounter();

        // Clear button
        clearBtn.addEventListener("click", () => {
            dialogueInput.value = "";
            updateCounter();
            summaryCard.style.display = "none";
            errorBanner.style.display = "none";
            dialogueInput.focus();
        });

        // Keyboard shortcut: Ctrl/Cmd + Enter
        dialogueInput.addEventListener("keydown", (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
                e.preventDefault();
                form.requestSubmit();
            }
        });

        // Copy button
        copyBtn.addEventListener("click", async () => {
            if (!summaryText.innerText) return;
            try {
                await navigator.clipboard.writeText(summaryText.innerText);
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "Copied!";
                setTimeout(() => { copyBtn.innerText = originalText; }, 2000);
            } catch (err) {
                console.error("Failed to copy:", err);
            }
        });

        // Form submission
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const dialogue = dialogueInput.value.trim();
            if (dialogue.length < 10) {
                showError("Please enter at least 10 characters to summarize.");
                return;
            }

            // Reset UI states
            errorBanner.style.display = "none";
            summaryCard.style.display = "none";
            submitBtn.disabled = true;
            btnText.innerHTML = `<span class="spinner"></span> Summarizing...`;

            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });

                const data = await response.json();

                if (!response.ok) {
                    const detail = data.detail;
                    const errorMsg = Array.isArray(detail)
                        ? detail.map(d => d.msg || d).join(", ")
                        : (detail || `Server error: ${response.status}`);
                    throw new Error(errorMsg);
                }

                summaryText.innerText = data.summary || "No summary could be generated.";
                summaryCard.style.display = "block";
            } catch (err) {
                showError(err.message || "Failed to communicate with summarization service.");
            } finally {
                submitBtn.disabled = false;
                btnText.innerText = "Summarize";
            }
        });

        function showError(msg) {
            errorBanner.innerText = msg;
            errorBanner.style.display = "block";
        }
    </script>
</body>
</html>
